name: Le Flash - aperçu (sans publication)

on:
  push:
    paths: ["apercu.txt", "essais/**"]       # contient le numéro du script à prévisualiser, ex. 001
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apercu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji && pip install -q -U yt-dlp
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: motion/package-lock.json
      - name: Moteur motion design (Remotion)
        run: cd motion && npm ci --no-audit --no-fund && npx remotion browser ensure
      - name: Cache des images et musiques
        uses: actions/cache@v4
        with:
          path: |
            clips/gta6
            musique
            videos
          key: ressources-v2-${{ hashFiles('ressources.py') }}
      - name: Images GTA 6 officielles + musiques libres de droits
        run: python ressources.py

      - name: Rendu de l'aperçu (voix + montage, pas d'envoi YouTube)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          STYLE: ${{ vars.STYLE_APERCU || 'motion' }}  # aperçus : nouveau style motion design (20/11)
          ELEVENLABS_VOICE_ID: ${{ vars.VOIX_APERCU || 'nVPCtAFzgyMX3FZKNzH0' }}  # « Anna B », choisie par Medley le 20/11
          ELEVENLABS_SPEED: ${{ vars.VITESSE_APERCU || '1.08' }}
        run: |
          ID=$(tr -d ' \r\n' < apercu.txt)
          mkdir -p apercu/scripts
          cp essais/$ID.json apercu/scripts/$ID.json 2>/dev/null || cp scripts/$ID.json apercu/scripts/$ID.json
          cp -r make_short.py pipeline.py motion_render.py marque motion apercu/
          cp -r clips apercu/ 2>/dev/null || true
          cp -r musique apercu/ 2>/dev/null || true
          cp -r videos apercu/ 2>/dev/null || true
          cd apercu && AUTO_UPLOAD=0 python pipeline.py $ID
      - name: Publier l'aperçu sur la branche apercus
        run: |
          ID=$(tr -d ' \r\n' < apercu.txt)
          mkdir -p /tmp/out && cp apercu/sorties/$ID.mp4 /tmp/out/apercu-$ID.mp4
          git config user.name "le-flash-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan apercus
          git rm -rq --cached . && git clean -fdq -e apercu
          cp /tmp/out/apercu-$ID.mp4 .
          git add apercu-$ID.mp4
          git commit -qm "Aperçu $ID"
          git push -f origin apercus
