name: Le Flash - production quotidienne

on:
  push:
    paths: ["scripts/**", "a_rendre_public.txt"]        # la veille de 7h35 pousse le script du jour
  schedule:
    - cron: "45 7 * * *"         # filet de sécurité : 8h45 heure de Paris (hiver)
  workflow_dispatch: {}          # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  produire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Outils (ffmpeg, librairies YouTube)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q google-api-python-client google-auth-oauthlib

      - name: Cache des images et musiques
        uses: actions/cache@v4
        with:
          path: |
            clips/gta6
            musique
            videos
          key: ressources-v2-${{ hashFiles('ressources.py') }}
      - name: Images GTA 6 officielles + musiques libres de droits
        run: python ressources.py

      - name: Identifiants YouTube (depuis les secrets du dépôt)
        env:
          YT_CLIENT: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          printf '%s' "$YT_CLIENT" > client_secret.json
          printf '%s' "$YT_TOKEN" > token.json

      - name: Voix + montage + envoi
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          STYLE: brut                                  # style validé par Medley le 18/11
          ELEVENLABS_VOICE_ID: NpMqpbmlioUVh6og0U5p    # Hélène, voix féminine dynamique
          AUTO_UPLOAD: "1"
          PUBLICATION: ${{ vars.PUBLICATION || 'public' }}
        run: |
          python pipeline.py
          python rendre_public.py

      - name: Garder une copie des vidéos (7 jours)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: sorties/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Noter les vidéos publiées
        run: |
          rm -f client_secret.json token.json
          git config user.name "le-flash-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A publies/ $(ls a_rendre_public.txt 2>/dev/null) || true
          git diff --cached --quiet || (git commit -m "Vidéos publiées $(date +%F)" && git push)
